# Project-wide Python tooling config (ruff lint + format).
# Per "Coding Standards: 101 Rules, Guidelines, and Best Practices" (Sutter &
# Alexandrescu): compile cleanly at high warning levels — the linter runs as
# part of the build/test gate, and the format is enforced project-wide.
[tool.ruff]
src = ["app", "tests", "scripts"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "B008",  # FastAPI Depends(...) as an argument default is idiomatic here.
    "C901",  # Complexity: keep a low threshold, but do not hard-fail a function.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "RUF012"]
# Alembic-autogenerated migrations: long table-definition lines are generated,
# not hand-written; reformatting them churns every regen for zero readability.
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"